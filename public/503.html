<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting... - Ukuiki</title>

  <meta http-equiv="refresh" content="3;url=https://ukuiki.vercel.app/">

  <style>
    /* CSS Variables for your Brand Colors */
    :root {
      --primary: #745EA5;
      --primary-light: #9686BB;
      --primary-dark: #57467B;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f9fafb;
      color: #1f2937;
    }

    .container {
      background: white;
      padding: 2.5rem 2rem;
      border-radius: 1rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
      max-width: 90%;
      width: 400px;
    }

    h1 {
      color: var(--primary-dark);
      /* Using Primary Dark for text */
      font-size: 1.5rem;
      margin-bottom: 1rem;
      font-weight: 700;
    }

    p {
      line-height: 1.6;
      color: #4b5563;
      margin-bottom: 2rem;
    }

    /* The Spinner using your Primary Color */
    .spinner {
      border: 4px solid #e5e7eb;
      border-top: 4px solid var(--primary);
      /* Primary Default */
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 1.5rem auto;
    }

    /* The Button using your Primary Color */
    .btn {
      background-color: var(--primary);
      /* Primary Default */
      color: white;
      padding: 12px 24px;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      transition: background-color 0.2s ease;
      display: inline-block;
    }

    /* Hover effect using Dark variant */
    .btn:hover {
      background-color: var(--primary-dark);
      /* Primary Dark */
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="spinner"></div>
    <h1>Hang tight! 🚧</h1>
    <p>
      The main server is a bit crowded right now.<br>
      Redirecting you to our backup site in <strong>3 seconds</strong>...
    </p>

    <a href="https://ukuiki.vercel.app/" class="btn">Go to Backup Site Now</a>
  </div>

  <script>
    setTimeout(function () {
      window.location.href = "https://ukuiki.vercel.app/";
    }, 10000);
  </script>
</body>

</html>
